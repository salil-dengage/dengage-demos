<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Bank | Low balance (Dengage portal content)</title>
<!-- =====================================================================
     MERIDIAN ONLINE BANKING, On-Site content for the panel

     Trigger:  DATA_LAYER_EVENT, eventName = banking_portal_low_balance
     Format:   Banner, top
     Spec:     banking/docs/PORTAL-SCENARIOS.md

     BANNER. Draws its OWN close control, because Banner layout is not
     offered the panel's "add close button to outside" setting. The close
     calls Dn.close() and never sendClick, so dismissing is not counted as a
     conversion.

     Banner content must be ordinary in-flow width:100%. The banner container
     is already position:fixed and full width, so full-bleed CSS here would
     double-position and render clipped in the panel preview.
     ================================================================== -->
<style>
#mrd-low-balance{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;color:#12203a;text-align:left;}
#mrd-low-balance *{box-sizing:border-box;}
#mrd-low-balance .m-eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#b8933c;font-weight:700;margin:0 0 6px;}
#mrd-low-balance .m-title{font-weight:600;font-size:15px;line-height:1.35;margin:0 0 6px;color:#0a2540;}
#mrd-low-balance .m-body{font-size:13px;line-height:1.55;color:#5a6b7f;margin:0 0 10px;}
#mrd-low-balance .m-small{font-size:11px;line-height:1.5;color:#94a3b8;margin:10px 0 0;}
#mrd-low-balance{display:flex;align-items:center;gap:14px;width:100%%;
  padding:11px 16px;background:#7a2718;color:#fff;}
#mrd-low-balance .m-title,#mrd-low-balance .m-body{color:#fff;margin:0;}
#mrd-low-balance .m-body{opacity:.85;font-size:12px;}
#mrd-low-balance .m-grow{flex:1;min-width:0;}
#mrd-low-balance .m-cta{background:#fff;color:#7a2718;text-decoration:none;font-size:13px;
  font-weight:600;padding:8px 14px;border-radius:6px;white-space:nowrap;}
#mrd-low-balance .m-close{background:none;border:0;color:#fff;opacity:.7;font-size:19px;
  line-height:1;cursor:pointer;padding:0 4px;}
#mrd-low-balance .m-close:hover{opacity:1;}

</style>
</head>
<body>
<div id="mrd-low-balance">
  <div class="m-grow">
    <p class="m-title">Your balance is low and direct debits are due</p>
    <p class="m-body">You have less than &pound;500 in your current account with bills still to clear this month.</p>
  </div>
  <a class="m-cta" href="https://salil-dengage.github.io/dengage-demos/banking/payments.html" target="_top" onclick="Dn.sendClick('banking_portal_low_balance__review')">Review what is due</a>
  <button class="m-close" type="button" aria-label="Close" onclick="Dn.close()">&times;</button>
</div>
</body>
</html>
