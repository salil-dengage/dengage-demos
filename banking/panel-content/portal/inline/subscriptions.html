<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Bank | Subscription creep (Dengage portal content)</title>
<!-- =====================================================================
     MERIDIAN ONLINE BANKING, On-Site content for the panel

     Trigger:  DATA_LAYER_EVENT, eventName = banking_portal_subscriptions
     Format:   Inline
     Spec:     banking/docs/PORTAL-SCENARIOS.md

     INLINE CONTENT. The rules are the OPPOSITE of a popup in three places:

       NOT SANDBOXED   there is no iframe. The SDK appends this <style> to
                       document.head, so an unscoped selector restyles the
                       customer's whole banking session. Every rule below is
                       under #mrd-subscriptions.
       NO sendClick    the SDK attaches its own listener to every a[href] it
                       injects, so an anchor is already counted. Calling
                       Dn.sendClick here would double-count it.
       NO target=_top  there is no frame to break out of.

     No <script>: the panel strips script blocks on save.
     ================================================================== -->
<style>
#mrd-subscriptions{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;color:#12203a;text-align:left;}
#mrd-subscriptions *{box-sizing:border-box;}
#mrd-subscriptions .m-eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#b8933c;font-weight:700;margin:0 0 6px;}
#mrd-subscriptions .m-title{font-weight:600;font-size:15px;line-height:1.35;margin:0 0 6px;color:#0a2540;}
#mrd-subscriptions .m-body{font-size:13px;line-height:1.55;color:#5a6b7f;margin:0 0 10px;}
#mrd-subscriptions .m-small{font-size:11px;line-height:1.5;color:#94a3b8;margin:10px 0 0;}
#mrd-subscriptions{background:#fff;border:1px solid #dde3ea;border-left:3px solid #b8933c;
  border-radius:10px;padding:1.1rem 1.2rem;}
#mrd-subscriptions .m-cta{font-size:13px;font-weight:600;color:#0a2540;text-decoration:none;}
#mrd-subscriptions .m-cta:hover{text-decoration:underline;}

</style>
</head>
<body>
<div id="mrd-subscriptions">
  <p class="m-eyebrow">Spending insight</p>
  <p class="m-title">&pound;49.97 a month on subscriptions</p>
  <p class="m-body">Across four recurring payments. That is &pound;599 a year. We are not telling you to cancel anything, only that most people have never added it up.</p>
  <a class="m-cta" href="https://salil-dengage.github.io/dengage-demos/banking/payments.html">Review your recurring payments</a>
</div>
</body>
</html>
