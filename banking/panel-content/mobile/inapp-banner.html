<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Bank | In-App banner (Dengage mobile content)</title>
<!-- =====================================================================
     MERIDIAN BANK ANDROID, In-App content for the panel

     Trigger:  screen name  test_inapp_banner   (Dengage.setNavigation)
     Format:   In-App, Banner
     Spec:     banking/panel-content/mobile/README.md

     THE BRIDGE ON MOBILE IS NOT THE BRIDGE ON THE WEB. The SDK injects a
     window.Dn object into the In-App WebView, and it is a different object
     from the one the website's panel content uses. Navigation is
     Dn.androidUrl('meridian://<screen>'), NOT an href with target="_top": the
     Navigation goes through Dn.androidUrl, and capture is Dn.setTags. These
     are the mobile bridge methods; the web contract's Dn.postQuestion and
     Dn.postSubscription do not apply here. Keep exactly this shape.

     BANNER. Draws its OWN close control, because Banner layout is not
     offered the panel's "add close button to outside" setting. The close
     calls Dn.close() and never sendClick, so dismissing is not counted as a
     conversion.

     Ordinary in-flow width:100%. The banner container is already positioned
     and full width, so full-bleed CSS here would double-position it.
     ================================================================== -->
<style>
#mrd-ia-banner{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;
  padding:12px 14px;background:#0a2540;color:#f7f5f0;}
#mrd-ia-banner *{box-sizing:border-box;}
#mrd-ia-banner .m-mark{width:34px;height:34px;flex:0 0 34px;border-radius:8px;
  background:rgba(200,164,77,.16);color:#c8a44d;font-family:Georgia,serif;font-size:15px;
  display:flex;align-items:center;justify-content:center;}
#mrd-ia-banner .m-grow{flex:1;min-width:0;}
#mrd-ia-banner .m-title{font-size:13.5px;font-weight:600;line-height:1.35;margin:0;}
#mrd-ia-banner .m-sub{font-size:11.5px;line-height:1.4;margin:2px 0 0;color:#9fb1c4;}
#mrd-ia-banner .m-cta{background:#c8a44d;color:#0a2540;text-decoration:none;font-size:12.5px;
  font-weight:700;padding:8px 13px;border-radius:6px;white-space:nowrap;}
#mrd-ia-banner .m-close{background:none;border:0;color:#f7f5f0;opacity:.55;font-size:19px;
  line-height:1;cursor:pointer;padding:0 2px;}
</style>
</head>
<body>
<div id="mrd-ia-banner">
  <div class="m-mark">&pound;</div>
  <div class="m-grow">
    <p class="m-title">Your salary landed this morning</p>
    <p class="m-sub">Move some into a 4.6% easy access ISA before it is spent.</p>
  </div>
  <a class="m-cta" href="#" role="button"
     onclick="Dn.sendClick('test_inapp_banner__save');Dn.androidUrl('meridian://products');return false">Save it</a>
  <button class="m-close" type="button" aria-label="Close" onclick="Dn.close()">&times;</button>
</div>
</body>
</html>
