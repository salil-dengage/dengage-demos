<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay | Image Popup (Dengage panel content)</title>
<!-- =====================================================================
     NOVAPAY IMAGE POPUP, On-Site content for the panel

     Paste this WHOLE file into the scenario editor. All CSS is scoped to
     #npy-imgpop. The image uses an absolute site URL so it also loads in the
     panel preview, and it is a committed SVG from this repository rather than
     any third-party host: a demo must not depend on someone else's CDN.

     Clicks: the whole card is the CTA and reports through Dn.sendClick(). The
     engine counts a click only when the content asks it to.

     Links: target="_top" so navigation leaves the cross-origin iframe rather
     than loading the site inside the popup box.

     Panel settings:
       - Scenario: triggerBy = DATA_LAYER_EVENT, eventName = fintech_image-popup
       - Popup design: width 460 to 520px, padding 0, transparent background
       - Layout > Close Button > "Add close button to outside" ON
====================================================================== -->
</head>
<body>

<div id="npy-imgpop">
  <style>
    #npy-imgpop *{margin:0;padding:0;box-sizing:border-box;}
    #npy-imgpop{
      --nv-blue:#125cfa; --nv-blue-dark:#0a3a9e; --nv-ink:#0f1c33; --nv-yellow:#ffd25a;
      font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;width:100%;position:relative;
    }
    body > #npy-imgpop{max-width:500px;margin:40px auto;}

    #npy-imgpop .ip-card{
      display:block;width:100%;position:relative;border-radius:18px;overflow:hidden;
      text-decoration:none;box-shadow:0 10px 34px rgba(15,28,51,.2);
      animation:ip-in .35s cubic-bezier(.21,.9,.35,1.1);background:var(--nv-ink);
    }
    @keyframes ip-in{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}

    #npy-imgpop .ip-photo{
      display:block;width:100%;height:300px;object-fit:cover;
      background:linear-gradient(135deg,#1b2a4a 0%,#0f1c33 100%);
    }
    #npy-imgpop .ip-shade{
      position:absolute;inset:0;
      background:linear-gradient(to top,rgba(15,28,51,.94) 0%,rgba(15,28,51,.5) 45%,rgba(15,28,51,.1) 78%);
    }
    #npy-imgpop .ip-copy{position:absolute;left:0;right:0;bottom:0;padding:22px 24px 24px;color:#fff;}
    #npy-imgpop .ip-tag{
      display:inline-block;background:var(--nv-yellow);color:var(--nv-ink);
      border-radius:7px;font:700 10px Inter,sans-serif;letter-spacing:.12em;
      text-transform:uppercase;padding:5px 9px;margin-bottom:10px;
    }
    #npy-imgpop h2{font-size:27px;font-weight:700;line-height:1.15;letter-spacing:-.6px;margin-bottom:6px;}
    #npy-imgpop h2 em{font-style:normal;color:var(--nv-yellow);}
    #npy-imgpop .ip-sub{font-size:13px;opacity:.9;margin-bottom:15px;line-height:1.5;}
    #npy-imgpop .ip-cta{
      display:inline-block;background:#fff;color:var(--nv-blue);border-radius:10px;
      font:700 12px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;
      padding:11px 20px;transition:all .2s ease;
    }
    #npy-imgpop .ip-card:hover .ip-cta{
      background:var(--nv-yellow);color:var(--nv-ink);transform:translateY(-1px);
    }
    #npy-imgpop .ip-fine{
      position:absolute;left:24px;right:24px;top:16px;
      font-size:10px;line-height:1.5;color:rgba(255,255,255,.62);
    }

    @media (max-width:420px){
      #npy-imgpop .ip-photo{height:260px;}
      #npy-imgpop h2{font-size:23px;}
      #npy-imgpop .ip-copy{padding:18px 18px 20px;}
    }
  </style>

  <a target="_top" class="ip-card"
     onclick="Dn.sendClick('fintech_image-popup__view-metal')"
     href="https://salil-dengage.github.io/dengage-demos/fintech/app.html"
     aria-label="See the Metal card">
    <img class="ip-photo" alt="The NovaPay Metal card"
      src="https://salil-dengage.github.io/dengage-demos/fintech/images/products/NPY-CRD-METAL.svg">
    <span class="ip-shade" aria-hidden="true"></span>
    <span class="ip-fine">Illustrative. Not a financial promotion.</span>
    <span class="ip-copy">
      <span class="ip-tag">Metal plan</span>
      <h2>Earn <em>2% back</em> on everything you buy</h2>
      <span class="ip-sub">
        Brushed metal, no foreign transaction fee, lounge access for two.
        $16.99 a month, cancel any time.
      </span>
      <span class="ip-cta">See the Metal card</span>
    </span>
  </a>
</div>

</body>
</html>
