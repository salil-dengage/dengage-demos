<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay | NPS Popup (Dengage panel content)</title>
<!-- =====================================================================
     NOVAPAY NPS, On-Site content for the panel

     Paste this WHOLE file into the scenario editor. All CSS is scoped to
     #npy-nps.

     The 0 to 10 score lives here rather than in the survey, because that is
     what it actually measures, and because the question form takes exactly one
     question.

     The -vh class hides the REAL radio inputs behind the styled score buttons.
     It is NOT close-button plumbing. Remove it and the whole 0 to 10 row
     unstyles, which has happened once already.

     Auto-close OFF: for a tag submission the handler's timer is 0 ms, so the
     thank-you panel would never be seen.

     Panel settings:
       - Scenario: triggerBy = DATA_LAYER_EVENT, eventName = fintech_nps-popup
       - Popup design: width 480 to 560px, padding 0, transparent background
       - Layout > Close Button > "Add close button to outside" ON
====================================================================== -->
</head>
<body>

<form class="form" data-dn-form-id="question_form" data-dn-validation-language="en"
      id="npy-nps" onsubmit="return false">
  <style>
    #npy-nps *{margin:0;padding:0;box-sizing:border-box;}
    #npy-nps{
      --nv-blue:#125cfa; --nv-blue-dark:#0a3a9e; --nv-ink:#0f1c33;
      --nv-muted:#64748b; --nv-line:#e3e8f0;
      font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;width:100%;
    }
    body > #npy-nps{max-width:540px;margin:40px auto;}

    #npy-nps .np-card{
      background:#fff;border-radius:18px;overflow:hidden;
      box-shadow:0 10px 34px rgba(15,28,51,.16);
      animation:np-in .35s cubic-bezier(.21,.9,.35,1.1);
    }
    @keyframes np-in{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}

    #npy-nps .np-head{padding:26px 28px 18px;text-align:center;}
    #npy-nps .np-mark{
      width:44px;height:44px;margin:0 auto 12px;border-radius:13px;
      background:linear-gradient(135deg,var(--nv-blue) 0%,var(--nv-blue-dark) 100%);
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:700;font-size:19px;
    }
    #npy-nps h2{font-size:20px;font-weight:700;color:var(--nv-ink);line-height:1.3;letter-spacing:-.3px;}
    #npy-nps .np-sub{font-size:12.5px;color:var(--nv-muted);margin-top:7px;line-height:1.55;}

    #npy-nps .np-body{padding:6px 28px 26px;}
    #npy-nps .np-scale{display:flex;gap:5px;justify-content:space-between;}

    /* Hides the real radios behind the styled score buttons. NOT close-button
       plumbing: removing this unstyles the entire 0 to 10 row. */
    #npy-nps .np-vh{
      position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
      clip:rect(0 0 0 0);white-space:nowrap;border:0;
    }
    #npy-nps .np-score{
      flex:1;display:flex;align-items:center;justify-content:center;
      height:40px;border:1.5px solid var(--nv-line);border-radius:9px;
      font-size:13px;font-weight:600;color:var(--nv-ink);cursor:pointer;
      transition:all .16s ease;background:#fff;
    }
    #npy-nps .np-score:hover{border-color:var(--nv-blue);color:var(--nv-blue);}
    #npy-nps .np-vh:checked + .np-score{
      border-color:var(--nv-blue);background:var(--nv-blue);color:#fff;
      box-shadow:0 4px 14px rgba(18,92,250,.28);transform:translateY(-2px);
    }

    #npy-nps .np-ends{
      display:flex;justify-content:space-between;margin-top:9px;
      font-size:11px;color:var(--nv-muted);font-weight:500;
    }
    #npy-nps .np-submit{
      display:block;width:100%;margin-top:20px;border:0;cursor:pointer;
      background:var(--nv-blue);color:#fff;border-radius:11px;
      font:700 13px Inter,sans-serif;letter-spacing:.04em;padding:14px;
      transition:background .2s ease,transform .15s ease;
    }
    #npy-nps .np-submit:hover{background:var(--nv-blue-dark);transform:translateY(-1px);}
    #npy-nps .np-note{
      margin-top:12px;font-size:11px;line-height:1.6;color:var(--nv-muted);text-align:center;
    }

    @media (max-width:460px){
      #npy-nps .np-head{padding:22px 18px 14px;}
      #npy-nps .np-body{padding:4px 18px 20px;}
      #npy-nps .np-score{height:34px;font-size:11.5px;}
      #npy-nps .np-scale{gap:3px;}
    }

    /* Validation text and the confirmation panel, both driven by the engine.
       The handler writes into div.form-message and stamps data-dn-invalid on
       the block; on a successful submit it stamps data-dn-is-submitted on
       .container. Without these rules the visitor clicks and nothing at all
       happens, which is exactly what was reported from a live demo. */
    #npy-nps .form-message{display:none;font-size:11.5px;color:#b3261e;margin-top:9px;}
    #npy-nps .form-block[data-dn-invalid="true"] .form-message{display:block;}
    #npy-nps .submitted-content{display:none;padding:40px 28px 42px;text-align:center;}
    #npy-nps .container[data-dn-is-submitted="true"] .np-body{display:none;}
    #npy-nps .container[data-dn-is-submitted="true"] .submitted-content{display:block;}
    #npy-nps .dn-tick{
      width:58px;height:58px;margin:0 auto 16px;border-radius:50%;
      background:rgba(18,92,250,.12);position:relative;
      animation:dn-pop .4s cubic-bezier(.2,1.6,.4,1);
    }
    @keyframes dn-pop{from{transform:scale(.4);opacity:0;}to{transform:none;opacity:1;}}
    #npy-nps .dn-tick::after{
      content:"";position:absolute;left:20px;top:22px;width:16px;height:8px;
      border-left:3px solid #125cfa;border-bottom:3px solid #125cfa;transform:rotate(-45deg);
    }
    #npy-nps .submitted-content h3{font-size:20px;font-weight:700;color:#0f1c33;margin-bottom:8px;}
    #npy-nps .submitted-content p{font-size:13px;color:#64748b;line-height:1.6;}
  </style>

  <div class="container np-card">
    <div class="np-head">
      <div class="np-mark" aria-hidden="true">N</div>
      <h2>How likely are you to recommend NovaPay?</h2>
      <p class="np-sub">One tap. It helps us more than you would think.</p>
    </div>

    <div class="np-body">
      <div class="form-block" data-dn-name="nps_score" data-dn-is-radio="true" data-dn-min-selection="1" data-dn-max-selection="1">
        <div class="np-scale">
          <input class="np-vh" type="radio" id="npy-np-0" name="npy-nps-score" value="0">
          <label class="np-score" for="npy-np-0">0</label>
          <input class="np-vh" type="radio" id="npy-np-1" name="npy-nps-score" value="1">
          <label class="np-score" for="npy-np-1">1</label>
          <input class="np-vh" type="radio" id="npy-np-2" name="npy-nps-score" value="2">
          <label class="np-score" for="npy-np-2">2</label>
          <input class="np-vh" type="radio" id="npy-np-3" name="npy-nps-score" value="3">
          <label class="np-score" for="npy-np-3">3</label>
          <input class="np-vh" type="radio" id="npy-np-4" name="npy-nps-score" value="4">
          <label class="np-score" for="npy-np-4">4</label>
          <input class="np-vh" type="radio" id="npy-np-5" name="npy-nps-score" value="5">
          <label class="np-score" for="npy-np-5">5</label>
          <input class="np-vh" type="radio" id="npy-np-6" name="npy-nps-score" value="6">
          <label class="np-score" for="npy-np-6">6</label>
          <input class="np-vh" type="radio" id="npy-np-7" name="npy-nps-score" value="7">
          <label class="np-score" for="npy-np-7">7</label>
          <input class="np-vh" type="radio" id="npy-np-8" name="npy-nps-score" value="8">
          <label class="np-score" for="npy-np-8">8</label>
          <input class="np-vh" type="radio" id="npy-np-9" name="npy-nps-score" value="9">
          <label class="np-score" for="npy-np-9">9</label>
          <input class="np-vh" type="radio" id="npy-np-10" name="npy-nps-score" value="10">
          <label class="np-score" for="npy-np-10">10</label>
        </div>
        <div class="np-ends">
          <span>Not likely</span>
          <span>Very likely</span>
        </div>
        <div class="form-message"></div>
      </div>

      <button type="submit" class="np-submit"
              onclick="Dn.sendClick('fintech_nps-popup__submit');Dn.postQuestion()">Send my score</button>

      <p class="np-note">
        NovaPay is a demonstration brand. No account is opened and no money moves.
      </p>
    </div>

    <div class="submitted-content" data-dn-is-enabled="true"
         data-dn-is-modal-auto-close-enabled="true" data-dn-modal-close-seconds="6">
      <div class="dn-tick" aria-hidden="true"></div>
      <h3>Thank you</h3>
      <p>Your score is recorded against your profile.</p>
    </div>
  </div>
</form>

</body>
</html>
