<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay | In-App banner (Dengage mobile content)</title>
<!-- =====================================================================
     NOVAPAY ANDROID, In-App content for the panel

     Trigger:  screen name  test_inapp_banner   (Dengage.setNavigation)
     Format:   In-App, Banner
     Spec:     fintech/panel-content/mobile/README.md

     THE BRIDGE ON MOBILE IS NOT THE BRIDGE ON THE WEB. The SDK injects a
     window.Dn object into the In-App WebView, and it is a different object
     from the one the website's panel content uses. Navigation goes through
     Dn.androidUrl('novapay://<screen>'), NOT an href with target="_top", and
     capture is Dn.setTags. The web contract's Dn.postQuestion and
     Dn.postSubscription do not exist here. Keep exactly this shape.

     BANNER. Draws its OWN close control, because Banner layout is not
     offered the panel's "add close button to outside" setting. The close
     calls Dn.close() and never sendClick, so dismissing is not counted as a
     conversion.

     Ordinary in-flow width:100%. The banner container is already positioned
     and full width, so full-bleed CSS here would double-position it.
     ================================================================== -->
<style>
#npy-ia-banner{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;
  padding:12px 14px;background:#0f1c33;color:#f5f7fb;}
#npy-ia-banner *{box-sizing:border-box;}
#npy-ia-banner .b-mark{width:34px;height:34px;flex:0 0 34px;border-radius:10px;
  background:rgba(18,92,250,.28);color:#8fb7ff;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;}
#npy-ia-banner .b-grow{flex:1;min-width:0;}
#npy-ia-banner .b-title{font-size:13.5px;font-weight:600;line-height:1.35;margin:0;}
#npy-ia-banner .b-sub{font-size:11.5px;line-height:1.4;margin:2px 0 0;color:#9aa8c0;}
#npy-ia-banner .b-cta{background:#34d399;color:#06301f;text-decoration:none;font-size:12.5px;
  font-weight:700;padding:8px 13px;border-radius:8px;white-space:nowrap;}
#npy-ia-banner .b-close{background:none;border:0;color:#f5f7fb;opacity:.55;font-size:19px;
  line-height:1;cursor:pointer;padding:0 2px;}
</style>
</head>
<body>
<div id="npy-ia-banner">
  <div class="b-mark">N</div>
  <div class="b-grow">
    <p class="b-title">Your pay landed this morning</p>
    <p class="b-sub">Move some into a goal before the month spends it for you.</p>
  </div>
  <a class="b-cta" href="#" role="button"
     onclick="Dn.sendClick('test_inapp_banner__save');Dn.androidUrl('novapay://grow');return false">Move it</a>
  <button class="b-close" type="button" aria-label="Close" onclick="Dn.close()">&times;</button>
</div>
</body>
</html>
