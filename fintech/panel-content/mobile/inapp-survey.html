<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay | In-App survey (Dengage mobile content)</title>
<!-- =====================================================================
     NOVAPAY ANDROID, In-App content for the panel

     Trigger:  screen name  test_inapp_survey   (Dengage.setNavigation)
     Format:   In-App, Survey
     Spec:     fintech/panel-content/mobile/README.md

     THE BRIDGE ON MOBILE IS NOT THE BRIDGE ON THE WEB. The SDK injects a
     window.Dn object into the In-App WebView, and it is a different object
     from the one the website's panel content uses. Navigation goes through
     Dn.androidUrl('novapay://<screen>'), NOT an href with target="_top", and
     capture is Dn.setTags. The web contract's Dn.postQuestion and
     Dn.postSubscription do not exist here. Keep exactly this shape.

     CAPTURE IS Dn.setTags, AND ITS ARGUMENT SHAPE IS UNFORGIVING. The native
     interface takes ONE string of comma separated key/value pairs, with the
     literal keys tag and value:

         Dn.setTags('tag:goal_interest,value:first_home')

     Anything else is dropped without a word. And tags attach to the DEVICE
     rather than the contact, so segment on the tag and do not go looking for
     it on the contact's Fields tab.

     THE -vh CLASS IS NOT CLOSE-BUTTON PLUMBING. It hides the real radios
     behind the styled option rows. Remove it and the whole list unstyles.

     Submitting closes the message with Dn.close(), which is a completed
     answer rather than a dismissal, so the sendClick above it is honest.
     ================================================================== -->
<style>
#npy-ia-survey{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;width:100%;background:#ffffff;border-radius:18px;
  overflow:hidden;color:#0f1c33;}
#npy-ia-survey *{box-sizing:border-box;}
#npy-ia-survey .s-head{background:#0f1c33;padding:20px 20px 18px;color:#f5f7fb;}
#npy-ia-survey .s-eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:#34d399;font-weight:700;margin:0 0 8px;}
#npy-ia-survey .s-title{font-size:20px;line-height:1.3;margin:0;font-weight:700;
  letter-spacing:-.3px;}
#npy-ia-survey .s-body{padding:16px 20px 20px;}
#npy-ia-survey .s-vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
#npy-ia-survey .s-opt{display:flex;align-items:center;gap:11px;padding:13px 14px;
  background:#fff;border:1.5px solid #e3e8f0;border-radius:12px;margin:0 0 8px;
  font-size:13.5px;color:#0f1c33;cursor:pointer;transition:all .16s ease;}
#npy-ia-survey .s-dot{width:18px;height:18px;flex:0 0 18px;border-radius:50%;
  border:1.5px solid #c3ccd6;}
#npy-ia-survey .s-vh:checked + .s-opt{border-color:#125cfa;background:#f5f8ff;}
#npy-ia-survey .s-vh:checked + .s-opt .s-dot{border-color:#125cfa;
  background:#125cfa;box-shadow:inset 0 0 0 3.5px #fff;}
#npy-ia-survey .s-submit{display:block;width:100%;margin-top:12px;border:0;cursor:pointer;
  background:#125cfa;color:#fff;border-radius:10px;
  font:700 14px Inter,-apple-system,sans-serif;padding:14px;}
#npy-ia-survey .s-small{font-size:10.5px;line-height:1.5;color:#a3adb9;margin:12px 0 0;
  text-align:center;}
</style>
</head>
<body>
<div id="npy-ia-survey">
  <div class="s-head">
    <p class="s-eyebrow">One question</p>
    <h2 class="s-title">What are you saving towards?</h2>
  </div>
  <div class="s-body">
    <input class="s-vh" type="radio" id="npy-sv-1" name="npy-goal" value="first_home">
    <label class="s-opt" for="npy-sv-1"><span class="s-dot"></span>A first home</label>

    <input class="s-vh" type="radio" id="npy-sv-2" name="npy-goal" value="travel">
    <label class="s-opt" for="npy-sv-2"><span class="s-dot"></span>A trip worth taking</label>

    <input class="s-vh" type="radio" id="npy-sv-3" name="npy-goal" value="rainy_day">
    <label class="s-opt" for="npy-sv-3"><span class="s-dot"></span>A rainy day</label>

    <input class="s-vh" type="radio" id="npy-sv-4" name="npy-goal" value="nothing_yet">
    <label class="s-opt" for="npy-sv-4"><span class="s-dot"></span>Nothing in particular</label>

    <button type="button" class="s-submit"
      onclick="Dn.sendClick('test_inapp_survey__submit');Dn.setTags('tag:goal_interest,value:'+(document.querySelector('#npy-ia-survey input:checked')||{value:''}).value);Dn.close()">Send</button>

    <p class="s-small">NovaPay is a fictional brand used for demonstration.</p>
  </div>
</div>
</body>
</html>
