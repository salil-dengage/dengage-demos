<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay | In-App bottom bar (Dengage mobile content)</title>
<!-- =====================================================================
     NOVAPAY ANDROID, In-App content for the panel

     Trigger:  screen name  test_inapp_bar   (Dengage.setNavigation)
     Format:   In-App, Banner, position BOTTOM
     Spec:     fintech/panel-content/mobile/README.md

     THE BRIDGE ON MOBILE IS NOT THE BRIDGE ON THE WEB. The SDK injects a
     window.Dn object into the In-App WebView, and it is a different object
     from the one the website's panel content uses. Navigation goes through
     Dn.androidUrl('novapay://<screen>'), NOT an href with target="_top", and
     capture is Dn.setTags. The web contract's Dn.postQuestion and
     Dn.postSubscription do not exist here. Keep exactly this shape.

     NOT AN ELEVENTH TEMPLATE. This is the Banner layout with position set to
     BOTTOM in the panel, which is worth saying out loud in a demo: the same
     content moves to where the thumb is without being rebuilt.

     Banner draws its own close, for the reason in inapp-banner.html.
     ================================================================== -->
<style>
#npy-ia-bar{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;
  padding:13px 14px;background:#ffffff;color:#0f1c33;
  border-top:1px solid #e3e8f0;box-shadow:0 -6px 20px rgba(15,28,51,.10);}
#npy-ia-bar *{box-sizing:border-box;}
#npy-ia-bar .b-grow{flex:1;min-width:0;}
#npy-ia-bar .b-title{font-size:13.5px;font-weight:600;line-height:1.35;margin:0;}
#npy-ia-bar .b-sub{font-size:11.5px;line-height:1.4;margin:2px 0 0;color:#64748b;}
#npy-ia-bar .b-cta{background:#125cfa;color:#ffffff;text-decoration:none;font-size:12.5px;
  font-weight:700;padding:9px 14px;border-radius:8px;white-space:nowrap;}
#npy-ia-bar .b-close{background:none;border:0;color:#0f1c33;opacity:.4;font-size:19px;
  line-height:1;cursor:pointer;padding:0 2px;}
</style>
</head>
<body>
<div id="npy-ia-bar">
  <div class="b-grow">
    <p class="b-title">Your rent leaves on Thursday</p>
    <p class="b-sub">1,450.00 to Harborview Lettings. The balance looks tight.</p>
  </div>
  <a class="b-cta" href="#" role="button"
     onclick="Dn.sendClick('test_inapp_bar__top_up');Dn.androidUrl('novapay://money');return false">Top up</a>
  <button class="b-close" type="button" aria-label="Close" onclick="Dn.close()">&times;</button>
</div>
</body>
</html>
