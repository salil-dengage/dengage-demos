<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay | Goal in reach (Dengage INLINE content)</title>
<!-- =====================================================================
     NOVAPAY, INLINE On-Site content for the account portal

     Inline Target Selector:  #dn_inline_target_in_grid
     Trigger:                 fintech_goal_in_reach
                              (DATA_LAYER_EVENT, pushed when a savings goal
                              sits between 70% and 99% funded)

     Inline rules, all four the opposite of the popup contract: scoped under
     #npy-inline-goal, no Dn.sendClick, no target="_top", no script blocks.
     See salary-landed.html for why each one.

     WHY HERE. At the end of the Grow view, under the goals themselves. The
     encouragement only makes sense next to the progress bar it refers to.

     WHY 70 TO 99. Below 70 the finish line is too far for a nudge to help,
     and at 100 the message is a congratulation, which is a different scenario
     with a different tone. Bounding it is what stops this becoming the banner
     that is always on.
     ================================================================== -->
<style>
#npy-inline-goal{
  font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff;border:1px solid #e3e8f0;border-radius:14px;
  padding:1.15rem 1.25rem;margin:1rem 0 0;color:#0f1c33;text-align:left;}
#npy-inline-goal *{box-sizing:border-box;margin:0;}
#npy-inline-goal .npy-g-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem;}
#npy-inline-goal .npy-g-dot{
  width:34px;height:34px;flex:none;border-radius:50%;
  background:rgba(18,92,250,.12);color:#125cfa;
  display:flex;align-items:center;justify-content:center;font-size:1rem;}
#npy-inline-goal .npy-g-title{font-size:.98rem;font-weight:700;letter-spacing:-.2px;}
#npy-inline-goal .npy-g-body{font-size:.83rem;line-height:1.6;color:#64748b;}
#npy-inline-goal .npy-g-bar{
  height:7px;background:#f1f4f9;border-radius:4px;overflow:hidden;margin:.85rem 0 .4rem;}
#npy-inline-goal .npy-g-bar span{
  display:block;height:100%;width:78%;border-radius:4px;
  background:linear-gradient(90deg,#125cfa,#0a3a9e);}
#npy-inline-goal .npy-g-scale{
  display:flex;justify-content:space-between;font-size:.68rem;color:#9aa5b5;}
#npy-inline-goal .npy-g-cta{
  display:inline-block;margin-top:.9rem;background:#125cfa;color:#fff;
  text-decoration:none;border-radius:9px;font-size:.78rem;font-weight:600;
  padding:.6rem 1rem;}
#npy-inline-goal .npy-g-why{font-size:.66rem;color:#9aa5b5;margin-top:.7rem;}
@media (max-width:480px){ #npy-inline-goal .npy-g-cta{width:100%;text-align:center;} }
</style>
</head>
<body>

<div id="npy-inline-goal">
  <div class="npy-g-top">
    <span class="npy-g-dot" aria-hidden="true">&#9679;</span>
    <p class="npy-g-title">You are nearly there</p>
  </div>
  <p class="npy-g-body">
    One more transfer would finish this goal. Round it up now, or turn on
    round-ups and let the change do it for you over the next few weeks.
  </p>
  <div class="npy-g-bar" role="img" aria-label="Goal progress, most of the way"><span></span></div>
  <div class="npy-g-scale"><span>Started</span><span>Target</span></div>
  <a class="npy-g-cta" href="app.html">Finish this goal</a>
  <p class="npy-g-why">
    Shown when a goal is between 70% and 99% funded. Figures are illustrative.
  </p>
</div>

</body>
</html>
