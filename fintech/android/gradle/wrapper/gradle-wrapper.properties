distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
# 8.11.1 rather than 8.9, and that is the whole point: it is the version the
# OTHER Android project in this repository already pins, so a machine that has
# opened that one has it cached in ~/.gradle/wrapper/dists and downloads
# NOTHING. AGP 8.7.3 needs Gradle 8.9 or newer, so 8.11.1 is fine.
#
# Two syncs failed before this, on 8.9, and the second one is why the version
# changed rather than the timeout: 10s 594ms with the generated
# networkTimeout=10000, then 1m 0s 811ms after it was raised to 60s. Raising it
# did not help. That machine can reach services.gradle.org, it took 5m37s to
# fetch 8.11.1 for the other project, so the fix is to need no download at all.
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
